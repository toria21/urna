<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Urna Eletrônica</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
            margin: 0;
            padding: 20px;
        }

        .urna {
            width: 900px;
            max-width: 95%;
            margin: auto;
            background-color: white;
            border: 3px solid #333;
            padding: 25px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .cargos {
            text-align: center;
            margin-bottom: 20px;
        }

        .cargos button {
            padding: 12px 25px;
            margin: 5px;
            border: none;
            background-color: #4b0082;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .principal {
            display: flex;
            gap: 30px;
        }

        .candidatos {
            width: 50%;
            border: 2px solid #333;
            padding: 15px;
            box-sizing: border-box;
        }

        .candidatos h2 {
            margin-top: 0;
        }

        .candidato {
            padding: 12px;
            margin: 8px 0;
            background-color: #f1f1f1;
            border: 1px solid #ccc;
            font-size: 18px;
        }

        .urna {
            text-align: center;
        }

        .teclado-area {
            width: 50%;
            background-color: #ddd;
            padding: 20px;
            box-sizing: border-box;
        }

        #numero {
            width: 150px;
            height: 50px;
            font-size: 30px;
            text-align: center;
            margin-bottom: 10px;
        }

        #nome {
            height: 30px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .teclado {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 250px;
            margin: auto;
        }

        .teclado button {
            height: 55px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .botoes-final {
            margin-top: 15px;
        }

        .corrige {
            background-color: #e5c400;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }

        .confirma {
            background-color: #22963b;
            color: white;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }

        #mensagem {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="urna">

    <h1>🗳️ URNA ELETRÔNICA</h1>

    <div class="cargos">
        <p><strong>Escolha o cargo:</strong></p>

        <button onclick="escolherCargo('Presidente')">
            PRESIDENTE
        </button>

        <button onclick="escolherCargo('Governador')">
            GOVERNADOR
        </button>
    </div>

    <div class="principal">

        
        <div class="candidatos">

            <h2 id="tituloCargo">Presidente</h2>

            <div id="listaCandidatos"></div>

        </div>


    
        <div class="teclado-area">

            <h2>Digite o número</h2>

            <input
                type="text"
                id="numero"
                maxlength="2"
                readonly
            >

            <div id="nome"></div>


            
            <div class="teclado">

                <button onclick="digitar('1')">1</button>
                <button onclick="digitar('2')">2</button>
                <button onclick="digitar('3')">3</button>

                <button onclick="digitar('4')">4</button>
                <button onclick="digitar('5')">5</button>
                <button onclick="digitar('6')">6</button>

                <button onclick="digitar('7')">7</button>
                <button onclick="digitar('8')">8</button>
                <button onclick="digitar('9')">9</button>

                <button onclick="digitar('0')">0</button>

            </div>


            
            <div class="botoes-final">

                <button
                    class="corrige"
                    onclick="corrigir()">
                    CORRIGE
                </button>

                <button
                    class="confirma"
                    onclick="confirmar()">
                    CONFIRMA
                </button>

            </div>

            <div id="mensagem"></div>

        </div>

    </div>

</div>


<script>

    

    const candidatos = {

        Presidente: {
            "13": "Taylor Swift",
            "05": "America Singer",
            "34": "Adam Carlsen"
        },

        Governador: {
            "69": "Sabrina Carpenter",
            "07": "Elyan Kane",
            "21": "Olive Smith"
        }

    };


    
    let cargoAtual = "Presidente";



    function mostrarCandidatos() {

        const lista =
            document.getElementById("listaCandidatos");

        lista.innerHTML = "";

        for (
            let numero in candidatos[cargoAtual]
        ) {

            const nome =
                candidatos[cargoAtual][numero];

            const candidato =
                document.createElement("div");

            candidato.className = "candidato";

            candidato.innerHTML =
                "<strong>" +
                numero +
                "</strong> - " +
                nome;

            lista.appendChild(candidato);
        }

        document.getElementById("tituloCargo")
            .innerText = cargoAtual;
    }

    function escolherCargo(cargo) {

        cargoAtual = cargo;

        corrigir();

        mostrarCandidatos();
    }


    function digitar(numero) {

        const campo =
            document.getElementById("numero");

        if (campo.value.length < 2) {

            campo.value += numero;

            verificarCandidato();
        }
    }


    

    function verificarCandidato() {

        const numero =
            document.getElementById("numero").value;

        const nome =
            document.getElementById("nome");

        if (
            candidatos[cargoAtual][numero]
        ) {

            nome.innerText =
                candidatos[cargoAtual][numero];

        } else {

            nome.innerText = "";
        }
    }


    function corrigir() {

        document.getElementById("numero")
            .value = "";

        document.getElementById("nome")
            .innerText = "";

        document.getElementById("mensagem")
            .innerText = "";
    }




    function confirmar() {

        const numero =
            document.getElementById("numero").value;

        const mensagem =
            document.getElementById("mensagem");


        if (numero === "") {

            alert(
                "Digite o número do candidato."
            );

            return;
        }


        if (
            !candidatos[cargoAtual][numero]
        ) {

            alert(
                "Número inválido!"
            );

            return;
        }


        const nome =
            candidatos[cargoAtual][numero];


        const confirmarVoto =
            confirm(
                "Cargo: " + cargoAtual +
                "\nNúmero: " + numero +
                "\nCandidato: " + nome +
                "\n\nConfirmar voto?"
            );


        if (confirmarVoto) {

            mensagem.innerText =
                "✅ VOTO CONFIRMADO! " +
                cargoAtual +
                ": " +
                nome;

            alert(
                "Voto confirmado!"
            );

            corrigir();
        }
    }


    

    mostrarCandidatos();

</script>

</body>
</html>
