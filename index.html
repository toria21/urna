<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Urna</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #d9d9d9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            margin: 0;
        }

        .urna {
            width: 800px;

            background-color: #555;

            padding: 30px;

            border-radius: 15px;

            display: flex;
            gap: 25px;

            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }


        

        input {
            display: none;
        }


        

        .tela {
            width: 480px;
            height: 400px;

            background-color: #f2f2f2;

            border: 8px solid #222;

            padding: 20px;

            box-sizing: border-box;
        }

        .tela h2 {
            text-align: center;
            margin-top: 0;
        }

        .numero-digitado {
            font-size: 22px;
            font-weight: bold;

            margin-top: 30px;
        }


        

        .resultado {
            display: none;

            margin-top: 30px;

            border: 2px solid #333;

            padding: 15px;

            background-color: white;
        }

        .resultado h3 {
            margin: 0 0 10px 0;
        }


        

        #confirmar:checked ~ .urna .resultado13 {
            display: none;
        }

        #confirmar:checked ~ .urna .resultado07 {
            display: none;
        }


        /* TAYLOR */

        #voto13:checked ~ .urna .tela .numero13 {
            display: block;
        }

        #voto13:checked ~ .urna .tela .numero07 {
            display: none;
        }


        /* SABRINA */

        #voto07:checked ~ .urna .tela .numero07 {
            display: block;
        }

        #voto07:checked ~ .urna .tela .numero13 {
            display: none;
        }


        

        #voto13:checked ~ #confirmar:checked ~ .urna .resultado13 {
            display: block;
        }


        

        #voto07:checked ~ #confirmar:checked ~ .urna .resultado07 {
            display: block;
        }


        

        .numero13,
        .numero07 {
            display: none;
        }


        

        .teclado {
            width: 250px;
        }

        .teclado h2 {
            color: white;

            text-align: center;

            margin-top: 0;
        }

        .numeros {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 10px;
        }


        .numero-teclado {
            height: 55px;

            background-color: #111;

            color: white;

            border: none;

            font-size: 20px;

            border-radius: 5px;

            display: flex;

            justify-content: center;

            align-items: center;

            cursor: pointer;
        }

        .numero-teclado:hover {
            background-color: #333;
        }


        /* BOTÕES */

        .acoes {
            display: flex;

            gap: 8px;

            margin-top: 15px;
        }

        .botao {
            flex: 1;

            padding: 12px 5px;

            border-radius: 5px;

            font-weight: bold;

            border: none;

            cursor: pointer;

            text-align: center;
        }

        .branco {
            background-color: white;

            color: black;
        }

        .corrige {
            background-color: #e5b800;

            color: black;
        }

        .confirma {
            background-color: #20a020;

            color: white;
        }

    </style>
</head>


<body>




    <input type="radio" name="voto" id="voto13">

                </p>

            </div>

        </div>


    

        <div class="teclado">

            <div class="acoes">

                <label for="confirmar" class="botao confirma">

                </label>

            </div>

        </div>

    </div>

</body>
